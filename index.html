<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e2e8f0;font-family:'Rajdhani',sans-serif;overflow-x:hidden}
select,input{background:#1a1f2e;border:1px solid #333;border-radius:4px;color:#e2e8f0;padding:6px 8px;font-size:14px;font-family:inherit;min-height:36px;max-width:100%}
button{cursor:pointer;font-family:inherit;border:none;border-radius:4px;min-height:36px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0d1117}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}

/* Layout - desktop: sidebar right */
.app-layout{display:grid;grid-template-columns:1fr 300px;min-height:100vh;gap:0}
.app-main{padding:12px;min-width:0;overflow:auto}
.app-sidebar{background:#111827;border-left:1px solid #1e293b;padding:12px;overflow:auto}

/* Add bar */
.add-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.add-bar select{flex:2;min-width:0}
.add-bar input{width:60px;flex-shrink:0}
.add-bar button{flex-shrink:0;white-space:nowrap;padding:6px 10px;font-size:12px}

/* Item row */
.item-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;flex-wrap:wrap;padding:4px 0}
.item-label{font-size:11px;min-width:0;flex:1 1 100%}
.item-resources{display:flex;gap:4px;flex-wrap:wrap;flex:1}

/* Resource bar */
.res-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Tabs */
.tabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{font-size:11px;padding:5px 8px}

/* Total grid */
.total-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;text-align:center}

/* Header */
.app-header{background:#111827;border-bottom:1px solid #1e293b;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}

/* Mobile nav tabs (show/hide panels) */
.mobile-nav{display:none}

/* Mobile: stack vertically, show nav tabs */
@media(max-width:768px){
  .app-layout{grid-template-columns:1fr;grid-template-rows:auto auto}
  .app-sidebar{border-left:none;border-top:1px solid #1e293b;min-height:auto}
  .mobile-nav{display:flex;background:#111827;border-bottom:1px solid #1e293b;overflow:hidden}
  .mobile-nav button{flex:1;padding:10px 4px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:0;border-right:1px solid #1e293b;min-height:44px}
  .mobile-nav button:last-child{border-right:none}
  .add-bar{gap:6px}
  .add-bar select{min-width:0;flex:1 1 auto}
  .add-bar input{width:52px}
  .add-bar button{font-size:11px;padding:5px 8px}
  .item-label{font-size:11px}
  .tabs button{font-size:10px;padding:4px 6px}
  select,input{font-size:13px}
  .app-header{padding:8px 10px}
  .app-main{padding:8px}
  .app-sidebar{padding:8px}
  .total-grid{gap:4px}
}

@media(max-width:400px){
  .tabs button{font-size:9px;padding:3px 5px}
  .add-bar button{font-size:10px;padding:4px 6px}
}
</style>

// Dynamic budget calculation
// Day morale: Dag1=70%, Dag2=76%, Dag3=76%
// Each capital adds +10% morale starting from (day-1)*24 + hour into the 3-day window
// A day is 24 hours; total = 72 hours. Capital at day D hour H means bonus applies for
// the remaining fraction of that day + all subsequent days.
function calcDynamicBudget(name, capitals, warbonds){
  const start = UNIVERSAL_START;
  const daily = COUNTRY_DAILY_100[name];
  if(!daily) return null;
  const baseMorale = [0.70, 0.76, 0.79];
  const effectiveMorale = [0, 0, 0];
  for(let d=0;d<3;d++){
    let bonus = 0;
    for(const cap of (capitals||[])){
      const cd=(cap.day||1)-1;
      const ch=Math.min(23,Math.max(0,cap.hour||0));
      if(cd<d) bonus+=0.10;
      else if(cd===d) bonus+=0.10*((24-ch)/24);
    }
    effectiveMorale[d]=Math.min(1.0, baseMorale[d]+bonus);
  }
  const result = {...start};
  for(let d=0;d<3;d++){
    for(const k of ["money","manpower","food","metal","oil"]){
      result[k] = (result[k]||0) + Math.round((daily[k]||0)*effectiveMorale[d]);
    }
  }
  return result;
}

// Per-day budget: returns income for a single day (1, 2, or 3)
function calcDailyBudget(name, capitals, warbonds, day){
  const daily = COUNTRY_DAILY_100[name];
  if(!daily) return null;
  const d = day - 1;
  const baseMorale = [0.70, 0.76, 0.79];
  let bonus = 0;
  for(const cap of (capitals||[])){
    const cd=(cap.day||1)-1;
    const ch=Math.min(23,Math.max(0,cap.hour||0));
    if(cd<d) bonus+=0.10;
    else if(cd===d) bonus+=0.10*((24-ch)/24);
  }
  const morale = Math.min(1.0, baseMorale[d]+bonus);
  const result = {};
  for(const k of ["money","manpower","food","metal","oil"]){
    result[k] = Math.round((daily[k]||0)*morale);
  }
  return result;
}

// Cumulative budget up to and including a given day (with start resources)
function calcCumulativeBudget(name, capitals, warbonds, upToDay){
  const daily = COUNTRY_DAILY_100[name];
  if(!daily) return null;
  const baseMorale = [0.70, 0.76, 0.79];
  const result = {...UNIVERSAL_START};
  for(let d=0; d<upToDay; d++){
    let bonus = 0;
    for(const cap of (capitals||[])){
      const cd=(cap.day||1)-1;
      const ch=Math.min(23,Math.max(0,cap.hour||0));
      if(cd<d) bonus+=0.10;
      else if(cd===d) bonus+=0.10*((24-ch)/24);
    }
    const morale = Math.min(1.0, baseMorale[d]+bonus);
    for(const k of ["money","manpower","food","metal","oil"]){
      result[k] = (result[k]||0) + Math.round((daily[k]||0)*morale);
    }
  }
  return result;
}

const WB_PER_10PCT_RESOURCE=457; // extra resource (food/metal/oil) per 10% warbond morale

const WB_PER_10PCT_MANPOWER=46;  // extra manpower per 10% warbond morale

// Geeft morale (fractie) op tijdstip timeDays (0-3) rekening houdend met capitals en warbonds
function getMoraleAtTime(timeDays, capitals, warbonds){
  const dayIdx=Math.min(2, Math.floor(timeDays));
  const base=[0.70,0.76,0.79][dayIdx];
  // Warbonds gelden alleen op dag 1 (dayIdx===0)
  const warbondBonus = dayIdx===0 ? Math.min(3,(warbonds||0))*0.10 : 0;
  let bonus=warbondBonus;
  for(const cap of (capitals||[])){
    const cd=(cap.day||1)-1;
    const ch=Math.min(23,Math.max(0,cap.hour||0));
    const capTimeDays=cd+ch/24;
    if(capTimeDays<=timeDays) bonus+=0.10;
  }
  return Math.min(1.0, base+bonus);
}

// Berekent productie per level met morale verwerkt per moment
// data = RC_DATA of INDUSTRY_DATA, capitals = [{day,hour},...]
function calcLeveledProduction(data, targetLvl, baseProduction, capitals, warbonds){
  const STEP=0.01;
  let total=0;
  let buildEnd=[];
  let t=0;
  for(let i=0;i<targetLvl;i++){t+=data[i].buildHours/24;buildEnd.push(t);}
  for(let t=0;t<GAME_DAYS;t+=STEP){
    const morale=getMoraleAtTime(t, capitals, warbonds);
    let activeBonus=0;
    for(let i=0;i<targetLvl;i++){
      const levelStart=i===0?0:buildEnd[i-1];
      const levelEnd=buildEnd[i];
      const dailyBonus=baseProduction*data[i].bonusPct;
      if(t<levelStart) break;
      if(t<levelEnd){activeBonus+=0.5*dailyBonus;break;}
      else if(i===targetLvl-1){activeBonus+=dailyBonus;}
    }
    total+=activeBonus*morale*STEP;
  }
  return Math.round(total);
}

function scaleCosts(costs,qty){const out={};for(const k of RES_KEYS)out[k]=(costs[k]||0)*qty;return out;}
function sumCosts(items){const total={money:0,food:0,metal:0,oil:0,manpower:0};for(const item of items){if(!item)continue;for(const k of RES_KEYS)total[k]+=(item[k]||0);}return total;}
function addCosts(a,b){const out={};for(const k of RES_KEYS)out[k]=(a[k]||0)+(b[k]||0);return out;}
function applyMult(costs,mult){const out={};for(const k of RES_KEYS)out[k]=Math.round((costs[k]||0)*mult);return out;}

function calcResearchCost(researchId,doctrine,qty){
  const chain=RESEARCH_CHAINS[researchId]||[];
  const allIds=[...chain,researchId];
  const total={money:0,food:0,metal:0,oil:0,manpower:0};
  for(const id of allIds){
    const unit=UNITS_RESEARCH.find(u=>u.id===id);
    if(!unit)continue;
    const base=unit.costs?unit.costs[doctrine]||unit.costs["Pan-Asian"]:{money:unit.money||0,food:unit.food||0,metal:unit.metal||0,oil:unit.oil||0};
    for(const k of RES_KEYS)total[k]+=(base[k]||0);
  }
  return scaleCosts(total,qty);
}

// Berekent totale extra productie van alle cities, met morale per moment via capitals
function calcCityIncome(cities, capitals, warbonds){
  const income={money:0,food:0,metal:0,oil:0,manpower:0};
  if(!cities)return income;
  for(const city of cities){
    // Warbond basisinkomen: per warbond op deze stad +10% morale op dag 1
    // Basisinkomen stad = 6000/dag resource + 600/dag manpower + geld (via calcDynamicBudget)
    // Hier tellen we alleen het extra dat de warbond geeft bovenop de 70% basismorale
    const cityWb = city.warbond||0;
    if(cityWb>0){
      // Per warbond = +10% morale op dag 1
      // Uit de game: elke 10% morale geeft +457 resource, +457 geld en +46 manpower per stad per day
      // Warbonds gelden alleen dag 1, dus x1 dag
      if(city.res && RES_KEYS.includes(city.res)){
        income[city.res]=(income[city.res]||0)+(cityWb * WB_PER_10PCT_RESOURCE);
      }
      income.money=(income.money||0)+(cityWb * WB_PER_10PCT_MONEY);
      income.manpower=(income.manpower||0)+(cityWb * WB_PER_10PCT_MANPOWER);
    }
    for(const b of (city.buildings||[])){
      if(b.name==="Industry"&&b.incomeRes){
        const total=calcLeveledProduction(INDUSTRY_DATA,b.lvl,BASE_CITY_PRODUCTION,capitals||[],cityWb);
        income[b.incomeRes]=(income[b.incomeRes]||0)+total*b.qty;
      } else if(b.name==="Recruiting Station"){
        const total=calcLeveledProduction(RC_DATA,b.lvl,BASE_MANPOWER_PRODUCTION,capitals||[],cityWb);
        income.manpower=(income.manpower||0)+total*b.qty;
      } else if(b.income){
        for(const k of Object.keys(b.income)){income[k]=(income[k]||0)+b.income[k];}
      }
    }
  }
  return income;
}

// Helper: get unique unit names from PRODUCTION for a doctrine
function getUnitNames(doctrine){
  const keys=Object.keys(PRODUCTION[doctrine]||PRODUCTION["Pan-Asian"]);
  const names=new Set();
  keys.forEach(k=>{const m=k.match(/^(.+) Lv\d+$/);if(m)names.add(m[1]);});
  return [...names];
}
function getUnitLevels(doctrine,unitName){
  const keys=Object.keys(PRODUCTION[doctrine]||PRODUCTION["Pan-Asian"]);
  return keys.filter(k=>k===unitName+' Lv'+k.match(/Lv(\d+)/)?.[1]&&k.startsWith(unitName+' Lv')).map(k=>parseInt(k.match(/Lv(\d+)/)[1])).sort((a,b)=>a-b);
}
function calcUpgradeCost(doctrine,unitName,fromLvl,toLvl,qty){
  const prod=PRODUCTION[doctrine]||PRODUCTION["Pan-Asian"];
  // Upgrade cost = 50% of the FROM level's production cost (Allies get 20% discount = 40%)
  const mult=doctrine==="Allies"?0.40:0.50;
  const fromCost=prod[unitName+' Lv'+fromLvl]||{};
  const diff={};
  const RES_KEYS2=["money","food","metal","oil","manpower"];
  for(const k of RES_KEYS2)diff[k]=Math.round((fromCost[k]||0)*mult)*qty;
  return diff;
}

  const validToLevels=availLevels.filter(l=>l>selFromLvl);
  const selToLvl=c.selUpgTo||(validToLevels[0]||selFromLvl+1);

  const addBuilding=()=>{
    const bldg=BUILDINGS.find(b=>b.name===c.selBuilding);
    if(!bldg)return;
    const lvl=Math.min(c.selBuildingLvl,bldg.maxLvl);
    const cost={};
    for(let l=0;l<lvl;l++){
      bldg.res.forEach((r,i)=>{cost[r]=(cost[r]||0)+bldg.costs[l][i]*c.selBuildingQty;});
    }
    const label=lvl>1?`${bldg.name} Lv1→${lvl}`:`${bldg.name} Lv1`;
    onChange({...c,buildings:[...c.buildings,{id:nextId++,name:bldg.name,lvl,qty:c.selBuildingQty,cost,type:"building",label}]});
  };

  const addProduction=()=>{
    const prodData=PRODUCTION[c.doctrine]||PRODUCTION["Pan-Asian"];
    const base=prodData[c.selProd];
    if(!base)return;
    const cost=scaleCosts(base,c.selProdQty);
    const newItems=[{id:nextId++,label:c.selProd,qty:c.selProdQty,type:"production",cost}];
    // Auto-add research indien nog niet aanwezig
    const match=c.selProd.match(/^(.+)\s+Lv(\d+)$/);
    if(match){
      const unitName=match[1];
      const lvl=parseInt(match[2]);
      const resEntry=UNITS_RESEARCH.find(u=>u.name===unitName+" "+lvl);
      if(resEntry){
        const alreadyHas=c.items.some(i=>i.type==="research"&&i.researchId===resEntry.id);
        const chain=RESEARCH_CHAINS[resEntry.id]||[];
        const chainSet2=new Set(chain);
        // Verwijder altijd lagere research (chain) die al bestaat
        c={...c,items:c.items.filter(i=>!(i.type==="research"&&chainSet2.has(i.researchId)))};
        if(!alreadyHas){
          const resCost=calcResearchCost(resEntry.id,c.doctrine,1);
          const chainStr=chain.length>0?" (incl. "+chain.join(", ")+")":"";
          newItems.push({id:nextId++,researchId:resEntry.id,label:"Research: "+resEntry.name+chainStr,qty:1,type:"research",cost:resCost});
        }
      }
    }
    onChange({...c,items:[...c.items,...newItems]});
  };

  const addUpgrade=()=>{
    const upg=UPGRADES[c.doctrine]||{};

    const cost=scaleCosts(base,c.selUpgradeQty);

          <input type="number" min={1} value={c.selUpgUnitQty||1} onChange={e=>onChange({...c,selUpgUnitQty:e.target.value})} onBlur={e=>{const v=parseInt(e.target.value);onChange({...c,selUpgUnitQty:isNaN(v)||v<1?1:v});}} onFocus={e=>e.target.select()} style={{width:60}}/>
          <button onClick={addUnitUpgrade} disabled={validToLevels.length===0} style={{background:validToLevels.length===0?"#1e293b":"#92400e",color:validToLevels.length===0?"#475569":"#fde68a",padding:"6px 14px",fontSize:13,fontWeight:700}}>+ Add</button>
        </div>

      </div>}

      {/* Research Tab */}
      {c.tab==="research"&&<div style={{background:"#0d1117",borderRadius:6,padding:10,marginBottom:12}}>
        <div className="add-bar">
          <select value={c.selResearch} onChange={e=>onChange({...c,selResearch:e.target.value})} style={{flex:2}}>
            {UNITS_RESEARCH.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}
          </select>
          <input type="number" min={1} value={c.selResearchQty} onChange={e=>onChange({...c,selResearchQty:e.target.value})} onBlur={e=>{const v=parseInt(e.target.value);onChange({...c,selResearchQty:isNaN(v)||v<1?1:v});}} onFocus={e=>e.target.select()} onClick={e=>e.target.select()} style={{width:60}}/>
          {(()=>{
  const resExists=c.items.some(i=>i.type==="research"&&i.researchId===c.selResearch);
  return<button onClick={addResearch} disabled={resExists} style={{background:resExists?"#1e293b":docColor,color:resExists?"#475569":"#fff",padding:"6px 14px",fontSize:13,fontWeight:700}}>{resExists?"✓ Added":"+ Add"}</button>;
})()}
        </div>
        {(()=>{const chain=RESEARCH_CHAINS[c.selResearch]||[];return chain.length>0&&<div style={{fontSize:11,color:"#64748b",marginTop:6}}>⚠ Includes prerequisites: {chain.join(" + ")}</div>;})()}
      </div>}

      {/* Cities Tab */}
      {c.tab==="cities"&&<div style={{background:"#0d1117",borderRadius:6,padding:10,marginBottom:12}}>
        {(!c.cities||c.cities.length===0)&&<div style={{color:"#475569",fontSize:12}}>Select a country first to see cities.</div>}
        {(c.cities||[]).map((city,cityIdx)=>{
          const resColor=RES_COLORS[city.res]||"#94a3b8";
          const selBldgCity=BUILDINGS.find(b=>b.name===(city.selBuilding||"Barracks"))||BUILDINGS[0];
          const addCityBuilding=()=>{
            if(!city.selBuilding)return;
            const bldg=BUILDINGS.find(b=>b.name===city.selBuilding);
            if(!bldg)return;
            const lvl=Math.min(city.selBuildingLvl||1,bldg.maxLvl);
            const cost={};
            for(let l=0;l<lvl;l++){bldg.res.forEach((r,i)=>{cost[r]=(cost[r]||0)+bldg.costs[l][i]*(city.selBuildingQty||1);});}
            // Extra productie voor Industry en RC — income wordt live herberekend via calcCityIncome
            let income=null;
            let incomeRes=null;
            if(bldg.name==="Industry"){incomeRes=city.res;}
            if(bldg.name==="Recruiting Station"){incomeRes="manpower";}
            const label=`${city.name}: ${lvl>1?bldg.name+' Lv1→'+lvl:bldg.name+' Lv1'}`;
            const newBuilding={id:nextId++,name:bldg.name,lvl,qty:city.selBuildingQty||1,cost,type:"building",label,income,incomeRes,cityName:city.name};
            const newCities=[...c.cities];
            newCities[cityIdx]={...city,buildings:[...(city.buildings||[]),newBuilding]};
            onChange({...c,cities:newCities,buildings:[...c.buildings,newBuilding]});
          };
          const removeCityBuilding=(buildingId)=>{
            const newCities=[...c.cities];
            newCities[cityIdx]={...city,buildings:(city.buildings||[]).filter(b=>b.id!==buildingId)};
            onChange({...c,cities:newCities,buildings:c.buildings.filter(b=>b.id!==buildingId)});
          };
          // Bereken productie van deze stad — live via calcCityIncome zodat capitals meebewegen
          const cityIncome=calcCityIncome([city], c.capitals||[], 0); // warbond handled per-city inside calcCityIncome
          const hasCityIncome=Object.values(cityIncome).some(v=>v>0);
          return(
            <div key={cityIdx} style={{background:"#111827",borderRadius:6,padding:10,marginBottom:10,borderLeft:`3px solid ${resColor}`}}>
              {/* City header */}
              {(()=>{
                const totalWb=(c.cities||[]).reduce((s,ci)=>s+(ci.warbond||0),0);
                const cityWb=city.warbond||0;
                const canAdd=totalWb<3;
                const setWb=(v)=>{const nc=[...c.cities];nc[cityIdx]={...city,warbond:v};onChange({...c,cities:nc});};
                return(
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8}}>
                  <span style={{fontWeight:700,fontSize:14,color:"#e2e8f0"}}>{city.name}</span>
                  <span style={{fontSize:11,color:resColor,textTransform:"uppercase",letterSpacing:1,display:"flex",alignItems:"center",gap:3}}><ResImg k={city.res} size={13}/> {city.res}</span>
                  <div style={{display:"flex",alignItems:"center",gap:4,marginLeft:4,background:"#2a1a28",borderRadius:5,padding:"3px 7px",border:"1px solid #52364d"}}>
                    <img src={WARBOND_ICON} style={{width:20,height:20,objectFit:"contain",verticalAlign:"middle"}}/>
                    <span style={{fontSize:10,color:"#c084b8",fontWeight:700,letterSpacing:0.5}}>Warbond 10% morale</span>
                    <button onClick={()=>cityWb>0&&setWb(cityWb-1)}
                      disabled={cityWb===0}
                      style={{background:cityWb>0?"#52364d":"#1e1020",color:cityWb>0?"#e9b8e0":"#3d2438",width:20,height:20,borderRadius:3,fontSize:13,fontWeight:700,border:`1px solid ${cityWb>0?"#7a4d72":"#2a1a28"}`,cursor:cityWb>0?"pointer":"not-allowed",lineHeight:1,padding:0,minHeight:"auto"}}>−</button>
                    <span style={{fontSize:13,fontWeight:700,color:cityWb>0?"#e9b8e0":"#3d2438",fontFamily:"monospace",minWidth:12,textAlign:"center"}}>{cityWb}</span>
                    <button onClick={()=>canAdd&&setWb(cityWb+1)}
                      disabled={!canAdd}
                      style={{background:canAdd?"#52364d":"#1e1020",color:canAdd?"#e9b8e0":"#3d2438",width:20,height:20,borderRadius:3,fontSize:13,fontWeight:700,border:`1px solid ${canAdd?"#7a4d72":"#2a1a28"}`,cursor:canAdd?"pointer":"not-allowed",lineHeight:1,padding:0,minHeight:"auto"}}>+</button>
                    
                  </div>
                  {hasCityIncome&&<span style={{fontSize:11,color:"#22c55e",marginLeft:"auto"}}>
                    {Object.entries(cityIncome).map(([k,v])=>v>0?<span key={k} style={{marginLeft:6,fontFamily:"monospace"}}>+{fmtC(v)} <ResImg k={k} size={13}/></span>:null)}
                  </span>}
                </div>
                );
              })()}
              {/* Add building to city */}
              {(()=>{
                const cityBldgSel=city.selBuilding||"";
                const cityBldgReady=!!cityBldgSel;
                const selBldgCityReady=BUILDINGS.find(b=>b.name===cityBldgSel)||null;
                return(
                <div className="add-bar" style={{marginBottom:8}}>
                  <select value={cityBldgSel} onChange={e=>{const nc=[...c.cities];nc[cityIdx]={...city,selBuilding:e.target.value,selBuildingLvl:1};onChange({...c,cities:nc});}} style={{flex:2}}>
                    <option value="">-- Kies gebouw --</option>
                    {BUILDINGS.filter(b=>!["Airfield","Local Industry","Fort","Harbor"].includes(b.name)).map(b=><option key={b.name} value={b.name}>{b.name}</option>)}
                  </select>
                  <select value={city.selBuildingLvl||1} disabled={!cityBldgReady} onChange={e=>{const nc=[...c.cities];nc[cityIdx]={...city,selBuildingLvl:Number(e.target.value)};onChange({...c,cities:nc});}}>
                    {cityBldgReady&&selBldgCityReady?Array.from({length:selBldgCityReady.maxLvl},(_,i)=>i+1).map(l=><option key={l} value={l}>Lv {l}</option>):<option>Lv 1</option>}
                  </select>
                  <input type="number" min={1} value={city.selBuildingQty||1} onChange={e=>{const nc=[...c.cities];nc[cityIdx]={...city,selBuildingQty:e.target.value};onChange({...c,cities:nc});}} onBlur={e=>{const v=parseInt(e.target.value);const nc=[...c.cities];nc[cityIdx]={...city,selBuildingQty:isNaN(v)||v<1?1:v};onChange({...c,cities:nc});}} onFocus={e=>e.target.select()} style={{width:55}}/>
                  <button onClick={addCityBuilding} disabled={!cityBldgReady} style={{background:cityBldgReady?docColor:"#1e293b",color:cityBldgReady?"#fff":"#475569",padding:"6px 12px",fontSize:12,fontWeight:700}}>+ Add</button>
                </div>);
              })()}
              {/* Buildings in this city */}
              {(city.buildings||[]).map(b=>{
                const typeColors={production:"#cbd5e1",upgrade:"#fbbf24",research:"#60a5fa",building:"#a78bfa",upkeep:"#34d399"};
                return(
                  <div key={b.id} style={{background:"#0d1117",borderRadius:4,padding:"5px 8px",marginBottom:4,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",borderLeft:"2px solid #a78bfa"}}>
                    <span style={{fontSize:12,color:"#a78bfa",flex:1}}><span style={{color:"#64748b",fontSize:11}}>×{b.qty} </span>{b.label.replace(city.name+": ","")}</span>
                    <ResourceBar costs={b.cost}/>
                    {b.income&&<span style={{fontSize:11,color:"#22c55e",fontFamily:"monospace",marginLeft:4}}>
                      {Object.entries(b.income).map(([k,v])=>v>0?<span key={k}>+{fmtC(v)} <ResImg k={k} size={13}/></span>:null)}
                    </span>}
                    <select value={b.day||1} onChange={e=>{const day=Number(e.target.value);const nc=[...c.cities];nc[cityIdx]={...city,buildings:(city.buildings||[]).map(x=>x.id===b.id?{...x,day}:x)};onChange({...c,cities:nc,buildings:c.buildings.map(x=>x.id===b.id?{...x,day}:x)});}}
                      style={{background:"#1e293b",border:`1px solid ${{1:"#3b82f6",2:"#a855f7",3:"#f97316"}[b.day||1]}`,borderRadius:4,color:{1:"#3b82f6",2:"#a855f7",3:"#f97316"}[b.day||1],fontSize:11,fontWeight:700,padding:"2px 4px",width:52,flexShrink:0}}>
                      <option value={1}>Day 1</option><option value={2}>Day 2</option><option value={3}>Day 3</option>
                    </select>
                    <button onClick={()=>removeCityBuilding(b.id)} style={{background:"none",color:"#ef4444",fontSize:18,padding:"0 4px",minHeight:"auto"}}>×</button>
                  </div>
                );
              })}
            </div>
          );
        })}
        {/* Show RC and Industry production separately */}
        {(()=>{
          // RC en Industry live herberekenen per stad met capitals en per-stad warbond
          const rcIncome={manpower:0};
          const indIncome={};
          for(const city of (c.cities||[])){
            const cWb=city.warbond||0;
            for(const b of (city.buildings||[])){
              if(b.name==="Recruiting Station"){
                const v=calcLeveledProduction(RC_DATA,b.lvl,BASE_MANPOWER_PRODUCTION,c.capitals||[],cWb)*b.qty;
                rcIncome.manpower=(rcIncome.manpower||0)+v;
              } else if(b.name==="Industry"&&b.incomeRes){
                const v=calcLeveledProduction(INDUSTRY_DATA,b.lvl,BASE_CITY_PRODUCTION,c.capitals||[],cWb)*b.qty;
                indIncome[b.incomeRes]=(indIncome[b.incomeRes]||0)+v;
              }
            }
          }
          const hasRC=rcIncome.manpower>0;
          const hasInd=Object.values(indIncome).some(v=>v>0);
          if(!hasRC&&!hasInd)return null;
          return(<div style={{display:"flex",flexDirection:"column",gap:6,marginTop:4}}>
            {hasRC&&<div style={{background:"#0d1a2e",borderRadius:6,padding:8,borderLeft:"3px solid #f97316"}}>
              <div style={{fontSize:10,color:"#f97316",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>👥 RC Extra Manpower (3 days)</div>
              <div className="total-grid">
                {Object.entries(rcIncome).map(([k,v])=>v>0?<div key={k} style={{textAlign:"center"}}>
                  <div><ResImg k={k} size={20}/></div>
                  <div style={{fontSize:13,fontWeight:700,color:"#f97316",fontFamily:"monospace"}}>+{fmtC(v)}</div>
                </div>:null)}
              </div>
            </div>}
            {hasInd&&<div style={{background:"#0d2211",borderRadius:6,padding:8,borderLeft:"3px solid #22c55e"}}>
              <div style={{fontSize:10,color:"#22c55e",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>🏭 Industry Extra Production (3 days)</div>
              <div className="total-grid">
                {Object.entries(indIncome).map(([k,v])=>v>0?<div key={k} style={{textAlign:"center"}}>
                  <div><ResImg k={k} size={20}/></div>
                  <div style={{fontSize:13,fontWeight:700,color:"#22c55e",fontFamily:"monospace"}}>+{fmtC(v)}</div>
                </div>:null)}
              </div>
            </div>}
          </div>);
        })()}
      </div>}

      {/* Items list */}
      {allItems.length>0&&<div style={{marginBottom:10}}>
        {c.buildings.map(b=><ItemRow key={b.id} item={b}
          onRemove={()=>removeBuilding(b.id)}
          onDayChange={day=>onChange({...c,buildings:c.buildings.map(x=>x.id===b.id?{...x,day}:x)})}
          docColor={docColor}/>)}
        {c.items.map(i=><ItemRow key={i.id} item={i}
          onRemove={()=>removeItem(i.id)}
          onDayChange={day=>onChange({...c,items:c.items.map(x=>x.id===i.id?{...x,day}:x)})}
          docColor={docColor}/>)}
      </div>}

      {/* Total with day filter */}
      {allItems.length>0&&(()=>{
        const selDay=c.selDay||0;
        const dayColors={0:"#64748b",1:"#3b82f6",2:"#a855f7",3:"#f97316"};
        const filteredItems=selDay===0?allItems:allItems.filter(i=>(i.day||1)===selDay);
        const filteredTotal=sumCosts(filteredItems.map(i=>i.cost));
        return(<div style={{background:"#0d1117",borderRadius:6,padding:10,borderLeft:`3px solid ${docColor}`}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8,flexWrap:"wrap"}}>
            <div style={{fontSize:10,color:"#64748b",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginRight:4}}>Total Cost</div>
            {[0,1,2,3].map(d=><button key={d} onClick={()=>onChange({...c,selDay:d})}
              style={{padding:"2px 8px",fontSize:11,fontWeight:700,borderRadius:4,
                background:selDay===d?dayColors[d]:"#1e293b",
                color:selDay===d?"#fff":dayColors[d],
                border:`1px solid ${dayColors[d]}`}}>
              {d===0?"All":` Day ${d}`}
            </button>)}
          </div>
          <div className="total-grid">
            {RES_KEYS.map(k=>(filteredTotal[k]||0)>0?<div key={k} style={{textAlign:"center"}}>
              <div><ResImg k={k} size={24}/></div>
              <div style={{fontSize:14,fontWeight:700,color:RES_COLORS[k],fontFamily:"monospace"}}>{fmtC(filteredTotal[k])}</div>
            </div>:null)}
          </div>
        </div>);
      })()}

      {/* Capitals UI — onderin */}
      {c.name&&(()=>{
        const caps=c.capitals||[];
        const dayColors2={1:"#3b82f6",2:"#a855f7",3:"#f97316"};
        // Calculate effective morale per day for display
        // Display always shows full +10% per capital (no fraction) — budget calc still uses the fraction
        const baseMorale=[70,76,79];
        const dispMorale=baseMorale.map((base,di)=>{
          let bonus=0;
          for(const cap of caps){
            const cd=(cap.day||1)-1;
            if(cd<=di) bonus+=10;
          }
          return Math.min(100, base+bonus);
        });
        return(
          <div style={{background:"#0d1117",borderRadius:6,padding:10,marginTop:8,borderLeft:"3px solid #f59e0b"}}>

            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:4}}>
              <div style={{fontSize:11,color:"#f59e0b",fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>🏛 Capitals (+10% morale)</div>
              <button onClick={()=>onChange({...c,capitals:[...caps,{id:nextId++,day:2,hour:0}]})}
                style={{background:"#92400e",color:"#fde68a",padding:"4px 12px",fontSize:12,fontWeight:700,borderRadius:4}}>
                + Capital
              </button>
            </div>
            {caps.length>0&&(
              <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:8}}>
                {caps.map((cap,ci)=>{
                  const dc=cap.day||1;
                  const hc=cap.hour||0;
                  const fracRemaining=((24-hc)/24*100).toFixed(0);
                  return(
                    <div key={cap.id} style={{display:"flex",alignItems:"center",gap:6,background:"#1a1f2e",borderRadius:5,padding:"5px 8px",border:`1px solid ${dayColors2[dc]}44`,flexWrap:"wrap"}}>
                      <span style={{fontSize:11,color:"#f59e0b",fontWeight:700,minWidth:20}}>🏛 {ci+1}</span>
                      <span style={{fontSize:10,color:"#64748b"}}>Day:</span>
                      <select value={dc} onChange={e=>{const nc=[...caps];nc[ci]={...cap,day:Number(e.target.value)};onChange({...c,capitals:nc});}}
                        style={{background:"#0d1117",border:`1px solid ${dayColors2[dc]}`,borderRadius:3,color:dayColors2[dc],fontWeight:700,fontSize:11,padding:"2px 4px",width:60}}>
                        <option value={2}>Day 2</option>
                        <option value={3}>Day 3</option>
                      </select>
                      <span style={{fontSize:10,color:"#64748b"}}>Uur:</span>
                      <input type="number" min={0} max={23} value={hc}
                        onChange={e=>{const v=Math.min(23,Math.max(0,parseInt(e.target.value)||0));const nc=[...caps];nc[ci]={...cap,hour:v};onChange({...c,capitals:nc});}}
                        onFocus={e=>e.target.select()}
                        style={{width:44,background:"#0d1117",border:`1px solid ${dayColors2[dc]}`,borderRadius:3,color:dayColors2[dc],fontWeight:700,fontSize:11,padding:"2px 4px",textAlign:"center"}}/>
                      <span style={{fontSize:10,color:"#475569",flex:1}}>({fracRemaining}% van dag {dc} telt mee)</span>
                      <button onClick={()=>onChange({...c,capitals:caps.filter((_,i)=>i!==ci)})}
                        style={{background:"none",color:"#ef4444",fontSize:16,padding:"0 3px",minHeight:"auto",lineHeight:1}}>×</button>
                    </div>
                  );
                })}
              </div>
            )}
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {[0,1,2].map(di=>{
                const col=dayColors2[di+1];
                const capBonusThisDay=dispMorale[di]-baseMorale[di];
                const hasBonus=capBonusThisDay>0.01;
                // Always show full base morale; show cap bonus separately
                return(
                  <div key={di} style={{background:hasBonus?"#1a1200":"#1a1f2e",borderRadius:6,padding:"6px 12px",border:`1px solid ${col}33`,flex:1,minWidth:70,textAlign:"center"}}>
                    <div style={{fontSize:9,color:col,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>Day {di+1}</div>
                    <div style={{fontSize:15,fontWeight:700,color:hasBonus?"#f59e0b":col,fontFamily:"monospace"}}>
                      {hasBonus?dispMorale[di].toFixed(1):baseMorale[di]}%
                    </div>
                    <div style={{fontSize:9,color:"#475569"}}>
                      {hasBonus?`${baseMorale[di]}% + capitals`:"base"}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* Budget remaining */}
      {(()=>{
        const budget=c.name?calcDynamicBudget(c.name,c.capitals||[],(c.cities||[]).reduce((s,ci)=>s+(ci.warbond||0),0)):null;
        if(!budget)return null;
        const cityIncome=calcCityIncome(c.cities, c.capitals||[], (c.cities||[]).reduce((s,ci)=>s+(ci.warbond||0),0));
        // Upkeep multiplier per productiedag: dag1=3 days, dag2=1.5, dag3=0.5
        const upkeepDayMult={1:2.5,2:1.5,3:0.5};
        const autoUpkeep={};
        // Starting units upkeep: 18x Inf Lv1, 3x Anti Tank Lv1, 3x Anti Air Lv1, 1x Aircraft Carrier Lv1
        const STARTING_UNITS=[
          {unit:"Infantry",lvl:1,qty:18},
          {unit:"Anti Tank",lvl:1,qty:3},
          {unit:"Anti Air",lvl:1,qty:3},
          {unit:"Aircraft Carrier",lvl:1,qty:1},
        ];
        for(const su of STARTING_UNITS){
          const data=UPKEEP_COSTS[su.unit+" "+su.lvl];
          if(!data)continue;
          const costs=data[c.doctrine]||data["Axis"]||{};
          // Starting units are always there all 3 days = multiply by 3
          for(const k of RES_KEYS) autoUpkeep[k]=(autoUpkeep[k]||0)+(costs[k]||0)*su.qty*3;
        }
        for(const item of c.items.filter(i=>i.type==="production")){
          const match=item.label.match(/^(.+)\s+Lv(\d+)$/);
          if(!match)continue;
          const upkeepKey=match[1]+" "+parseInt(match[2]);
          const data=UPKEEP_COSTS[upkeepKey];
          if(!data)continue;
          const costs=data[c.doctrine]||data["Axis"]||{};
          const mult=upkeepDayMult[item.day||1]||3;
          for(const k of RES_KEYS) autoUpkeep[k]=(autoUpkeep[k]||0)+(costs[k]||0)*(item.qty||1)*mult;
        }
        const remaining={};
        let anyNegative=false;
        for(const k of RES_KEYS){remaining[k]=(budget[k]||0)+(cityIncome[k]||0)-(grandTotalFiltered[k]||0)-(autoUpkeep[k]||0);if(remaining[k]<0)anyNegative=true;}
        const _caps=c.capitals||[];
        const _bm=[70,76,79];
        const _dm=_bm.map((base,di)=>{let b=0;for(const cap of _caps){const cd=(cap.day||1)-1;if(cd<=di)b+=10;}return Math.min(100, base+b);});
        const moraleStr=`Day1:${_dm[0].toFixed(1)}% Day2:${_dm[1].toFixed(1)}% Day3:${_dm[2].toFixed(1)}%`;
        return(
          <div style={{background:"#0d1117",borderRadius:6,padding:10,borderLeft:`3px solid ${anyNegative?"#ef4444":"#22c55e"}`,marginTop:8}}>
            <div style={{fontSize:10,color:"#64748b",fontWeight:700,letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>
              Budget Remaining <span style={{color:"#475569",fontWeight:400}}>({moraleStr} + city production)</span>
            </div>
            <div className="total-grid">
              {RES_KEYS.map(k=>{
                const r=remaining[k];
                const hasCost=(grandTotal[k]||0)>0||(budget[k]||0)>0||(cityIncome[k]||0)>0;
                if(!hasCost)return null;
                return(<div key={k} style={{textAlign:"center"}}>
                  <div><ResImg k={k} size={24}/></div>
                  <div style={{fontSize:14,fontWeight:700,color:r<0?"#ef4444":"#22c55e",fontFamily:"monospace"}}>{r<0?"-":""}{fmtC(Math.abs(r))}</div>
                </div>);
              })}
            </div>
            {anyNegative&&<div style={{fontSize:11,color:"#ef4444",marginTop:6}}>⚠ Over budget on one or more resources!</div>}

            {/* Upkeep section */}
            {(()=>{
              // Starting units
              const STARTING_UNITS=[
                {unit:"Infantry",lvl:1,qty:18},
                {unit:"Anti Tank",lvl:1,qty:3},
                {unit:"Anti Air",lvl:1,qty:3},
                {unit:"Aircraft Carrier",lvl:1,qty:1},
              ];
              const startCost={};
              for(const su of STARTING_UNITS){
                const data=UPKEEP_COSTS[su.unit+" "+su.lvl];
                if(!data)continue;
                const uc=data[c.doctrine]||data["Axis"]||{};
                for(const k of RES_KEYS) startCost[k]=(startCost[k]||0)+(uc[k]||0)*su.qty*3;
              }
              // Produced units
              const prodItems=c.items.filter(i=>i.type==="production");
              const grouped={};
              for(const item of prodItems){
                const match=item.label.match(/^(.+)\s+Lv(\d+)$/);
                if(!match)continue;
                const unitName=match[1],lvl=parseInt(match[2]),day=item.day||1;
                const baseKey=unitName+" "+lvl;
                if(!UPKEEP_COSTS[baseKey])continue;
                const upkeepKey=unitName+" "+lvl+"-day"+day;
                if(!grouped[upkeepKey])grouped[upkeepKey]={unitName,lvl,qty:0,day,baseKey};
                grouped[upkeepKey].qty+=item.qty||1;
              }
              const entries=Object.entries(grouped);
              const upkeepMult={1:2.5,2:1.5,3:0.5};
              const prodCost={};
              for(const [,{unitName,lvl,qty,day,baseKey}] of entries){
                const data=UPKEEP_COSTS[baseKey];
                const uc=data[c.doctrine]||data["Axis"]||{};
                const mult=upkeepMult[day||1]||3;
                for(const k of RES_KEYS) prodCost[k]=(prodCost[k]||0)+(uc[k]||0)*qty*mult;
              }
              // Combined total
              const totalUpkeep={};
              for(const k of RES_KEYS) totalUpkeep[k]=(startCost[k]||0)+(prodCost[k]||0);
              const hasAny=RES_KEYS.some(k=>(totalUpkeep[k]||0)>0);
              if(!hasAny)return null;
              return(
                <div style={{marginTop:10,background:"#060c14",borderRadius:6,border:"1px solid #1e293b",overflow:"hidden"}}>
                  {/* Header */}
                  <div style={{background:"#0d1a1a",padding:"6px 10px",borderBottom:"1px solid #1e293b",display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:10,color:"#34d399",fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>⚙️ Upkeep (3-day total)</span>
                  </div>
                  <div style={{padding:"8px 10px"}}>
                    {/* Starting units row */}
                    <div style={{display:"grid",gridTemplateColumns:"180px 1fr",alignItems:"center",gap:8,marginBottom:4}}>
                      <span style={{color:"#64748b",fontSize:11}}>Starting units (18×Inf 3×AT 3×AA 1×AC)</span>
                      <ResourceBar costs={startCost}/>
                    </div>
                    {/* Produced units */}
                    {entries.map(([key,{unitName,lvl,qty,day,baseKey}])=>{
                      const data=UPKEEP_COSTS[baseKey];
                      const uc=data[c.doctrine]||data["Axis"]||{};
                      const mult=upkeepMult[day||1]||3;
                      const lineCost={};
                      for(const k of RES_KEYS) lineCost[k]=(uc[k]||0)*qty*mult;
                      return(
                        <div key={key} style={{display:"grid",gridTemplateColumns:"180px 1fr",alignItems:"center",gap:8,marginBottom:4}}>
                          <span style={{color:"#94a3b8",fontSize:11}}>{unitName} Lv{lvl} ×{qty} <span style={{color:"#475569",fontSize:10}}>×{mult}d</span></span>
                          <ResourceBar costs={lineCost}/>
                        </div>
                      );
                    })}
                    {/* Total row */}
                    <div style={{borderTop:"1px solid #1e293b",marginTop:6,paddingTop:6,display:"grid",gridTemplateColumns:"180px 1fr",alignItems:"center",gap:8}}>
                      <span style={{color:"#e2e8f0",fontWeight:700,fontSize:11}}>Total upkeep</span>
                      <ResourceBar costs={totalUpkeep}/>
                    </div>
                  </div>
                </div>
              );
            })()}
          </div>
        );
      })()}
    </div>
  );
}

function App(){
  const[countries,setCountries]=useState([makeCountry(null)]);
  const[sidebarDay,setSidebarDay]=useState(0);
  const[mobilePanel,setMobilePanel]=useState('calc');
  const[screen,setScreen]=useState('splash'); // 'splash', 'home' or 'calculator'
  const[saves,setSaves]=useState([]);
  const[currentSaveName,setCurrentSaveName]=useState('');
  const[newBuildName,setNewBuildName]=useState('');

  // Load saves list from Firebase
  React.useEffect(()=>{
    const init=()=>{
      if(!window._firebaseDb)return;
      const db=window._firebaseDb;
      // Mark as connected
      setSyncStatus('synced');
      const dbRef=window._firebaseRef(db,'calculator/saves');
      window._firebaseOnValue(dbRef,(snapshot)=>{
        const data=snapshot.val();
        if(data){
          const list=Object.entries(data).map(([key,val])=>({key,...val}));
          list.sort((a,b)=>b.updatedAt-a.updatedAt);
          setSaves(list);
        } else {
          setSaves([]);
        }
      });
    };
    if(window._firebaseReady){init();}
    else{window.addEventListener('firebaseReady',init);}
    return()=>window.removeEventListener('firebaseReady',init);
  },[]);

  const saveBuild=(name)=>{
    if(!window._firebaseDb||!name.trim())return;
    const db=window._firebaseDb;
    const key=name.trim().replace(/[^a-zA-Z0-9_-]/g,'_');
    const dbRef=window._firebaseRef(db,'calculator/saves/'+key);
    window._firebaseSet(dbRef,{
      name:name.trim(),
      countries:JSON.stringify(countries),
      updatedAt:Date.now()
    }).then(()=>{
      setCurrentSaveName(name.trim());
      setShowSaveDialog(false);
      setNewBuildName('');
    });
  };

  const loadBuild=(save)=>{
    try{
      const loaded=JSON.parse(save.countries);
      if(Array.isArray(loaded)){
        setCountries(loaded);
        setCurrentSaveName(save.name);
        setScreen('calculator');
      }
    }catch(e){console.error(e);}
  };

  const deleteBuild=(save,e)=>{
    e.stopPropagation();
    if(!confirm('Delete "'+save.name+'"?'))return;
    if(!window._firebaseDb)return;
    const db=window._firebaseDb;
    const dbRef=window._firebaseRef(db,'calculator/saves/'+save.key);
    window._firebaseSet(dbRef,null);
  };

  const newBuild=(name)=>{
    setCountries([makeCountry(null)]);
    setCurrentSaveName(name||'New Build');
    setScreen('calculator');
  };
  const[syncStatus,setSyncStatus]=useState('connecting');
  const[lastSaved,setLastSaved]=useState(null);
  const isUpdatingFromDb=React.useRef(false);
  const[presentUsers,setPresentUsers]=useState([]);
  const myPresenceRef=React.useRef(null);
  const mySessionId=React.useRef('u_'+Math.random().toString(36).slice(2,8));

  // Presence: register this user and track others in the same build
  React.useEffect(()=>{
    if(!currentSaveName)return;
    const init=()=>{
      if(!window._firebaseDb)return;
      const db=window._firebaseDb;
      const buildKey=currentSaveName.trim().replace(/[^a-zA-Z0-9_-]/g,'_');
      const presenceBase=window._firebaseRef(db,'calculator/presence/'+buildKey);
      const myRef=window._firebaseRef(db,'calculator/presence/'+buildKey+'/'+mySessionId.current);
      myPresenceRef.current=myRef;
      const initialData={sessionId:mySessionId.current,joinedAt:Date.now(),viewing:null,lastSeen:Date.now()};
      window._firebaseSet(myRef,initialData);
      window._firebaseOnDisconnect(myRef).remove();
      window._firebaseOnValue(presenceBase,(snap)=>{
        const data=snap.val();
        if(!data){setPresentUsers([]);return;}
        const users=Object.values(data).filter(u=>u.sessionId!==mySessionId.current&&(Date.now()-u.lastSeen)<30000);
        setPresentUsers(users);
      });
    };
    if(window._firebaseReady)init();
    else window.addEventListener('firebaseReady',init);
    return()=>{
      if(myPresenceRef.current)window._firebaseRemove(myPresenceRef.current);
      window.removeEventListener('firebaseReady',init);
    };
  },[currentSaveName]);

  // Heartbeat to keep presence alive
  React.useEffect(()=>{
    const interval=setInterval(()=>{
      if(!myPresenceRef.current||!window._firebaseDb)return;
      // Update only lastSeen using a transaction-like approach
      const db=window._firebaseDb;
      window._firebaseOnValue(myPresenceRef.current,(snap)=>{
        const cur=snap.val();
        if(cur)window._firebaseSet(myPresenceRef.current,{...cur,lastSeen:Date.now()});
      },{onlyOnce:true});
    },10000);
    return()=>clearInterval(interval);
  },[]);

  // Update detailed presence: country, tab, last action
  const updateMyPresence=(info)=>{
    if(!myPresenceRef.current)return;
    window._firebaseSet(myPresenceRef.current,{
      sessionId:mySessionId.current,
      joinedAt:Date.now(),
      viewing:info.country||null,
      tab:info.tab||null,
      lastAction:info.lastAction||null,
      lastSeen:Date.now()
    });
  };
  // Keep backward compat
  const updateMyViewing=(name)=>updateMyPresence({country:name});

  // Live sync: listen to live-changes from others for this build
  React.useEffect(()=>{
    if(!currentSaveName)return;
    const init=()=>{
      if(!window._firebaseDb)return;
      const db=window._firebaseDb;
      const buildKey=currentSaveName.trim().replace(/[^a-zA-Z0-9_-]/g,'_');
      const liveRef=window._firebaseRef(db,'calculator/live/'+buildKey);
      const unsub=window._firebaseOnValue(liveRef,(snap)=>{
        const data=snap.val();
        if(!data||data.by===mySessionId.current)return;
        // Only apply if the update is newer than our last save
        if(data.countries){
          try{
            const loaded=JSON.parse(data.countries);
            if(Array.isArray(loaded)){
              isUpdatingFromDb.current=true;
              setCountries(loaded);
              setTimeout(()=>{isUpdatingFromDb.current=false;},100);
            }
          }catch(e){}
        }
      });
      return unsub;
    };
    let unsub;
    if(window._firebaseReady)unsub=init();
    else window.addEventListener('firebaseReady',()=>{unsub=init();});
    return()=>{if(typeof unsub==='function')unsub();};
  },[currentSaveName]);

  // Auto-save current build when countries change
  const saveTimeout=React.useRef(null);
  React.useEffect(()=>{
    if(!window._firebaseDb||!currentSaveName||syncStatus==='connecting')return;
    if(isUpdatingFromDb.current)return; // don't re-broadcast changes we received
    setSyncStatus('saving');
    // Broadcast live to others immediately (no debounce)
    const db=window._firebaseDb;
    const buildKey=currentSaveName.trim().replace(/[^a-zA-Z0-9_-]/g,'_');
    const liveRef=window._firebaseRef(db,'calculator/live/'+buildKey);
    window._firebaseSet(liveRef,{countries:JSON.stringify(countries),by:mySessionId.current,at:Date.now()});
    if(saveTimeout.current)clearTimeout(saveTimeout.current);
    saveTimeout.current=setTimeout(()=>{
      saveBuild(currentSaveName);
      setSyncStatus('synced');
    },2000);
  },[countries]);
  // Day 1 = 70%, Day 2 = 76%, Day 3 = 76% + capitals×10% (per country)
  const morale=[70,76,79];
  const updateCountry=(id,updated,actionHint)=>{
    // Detect what changed for presence
    const prev=countries.find(c=>c.id===id);
    let lastAction=actionHint||null;
    if(!lastAction&&prev){
      const prevItems=(prev.items||[]).length+(prev.buildings||[]).length;
      const newItems=(updated.items||[]).length+(updated.buildings||[]).length;
      if(newItems>prevItems){
        // Something was added — find the new item
        const allNew=[...(updated.items||[]),...(updated.buildings||[])];
        const allOld=new Set([...(prev.items||[]),...(prev.buildings||[])].map(i=>i.id));
        const added=allNew.filter(i=>!allOld.has(i.id));
        if(added.length>0){
          const a=added[0];
          const label=a.label||(a.name?`${a.name} Lv${a.lvl||1}`:'item');
          lastAction=`➕ ${label}${a.qty>1?' ×'+a.qty:''}`;
        }
      } else if(newItems<prevItems){
        lastAction='🗑 item verwijderd';
      } else if(updated.tab!==prev.tab){
        lastAction=null; // tab switch, don't show as action
      }
    }
    updateMyPresence({country:updated.name||null,tab:updated.tab||null,lastAction});
    setCountries(countries.map(c=>c.id===id?updated:c));
  };
  const removeCountry=(id)=>setCountries(countries.filter(c=>c.id!==id));
  const dayColors={0:"#64748b",1:"#3b82f6",2:"#a855f7",3:"#f97316"};

  const getFilteredItems=(c)=>{
    const all=[...c.buildings,...c.items];
    return sidebarDay===0?all:all.filter(i=>(i.day||1)<=sidebarDay);
  };
  const grandTotal=sumCosts(countries.flatMap(c=>getFilteredItems(c).map(i=>i.cost)));
  const grandIncome=(()=>{
    const inc={};
    for(const c of countries){
      const warbonds=(c.cities||[]).reduce((s,ci)=>s+(ci.warbond||0),0);
      const budget=c.name?(sidebarDay===0?calcDynamicBudget(c.name,c.capitals||[],warbonds):calcCumulativeBudget(c.name,c.capitals||[],warbonds,sidebarDay)):null;
      const cityIncTotal=calcCityIncome(c.cities||[], c.capitals||[], warbonds);
      const cityInc=sidebarDay===0?cityIncTotal:Object.fromEntries(Object.entries(cityIncTotal).map(([k,v])=>[k,Math.round(v/3*sidebarDay)]));
      if(budget){for(const k of RES_KEYS){inc[k]=(inc[k]||0)+(budget[k]||0)+(cityInc[k]||0);}}
    }
    return inc;
  })();

  // SPLASH SCREEN
  if(screen==='splash'){
    return(
      <div style={{minHeight:"100vh",background:"#0a0c10",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Rajdhani',sans-serif",cursor:"pointer"}}
        onClick={()=>setScreen('home')}>

          <div>
            <div style={{fontSize:18,fontWeight:700,letterSpacing:3,color:"#e2e8f0",lineHeight:1}}>AF Build Calculator</div>
            <div style={{fontSize:10,letterSpacing:2,color:"#b48c3c",textTransform:"uppercase"}}>Amicitia Ferox</div>
          </div>
        </div>
        <div style={{maxWidth:860,margin:"48px auto",padding:"0 24px"}}>
          <div style={{background:"#0d1117",borderRadius:14,padding:28,marginBottom:24,border:"1px solid #1e293b"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#b48c3c",letterSpacing:3,textTransform:"uppercase",marginBottom:14}}>➕ New Build</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <input placeholder="Name your build..." value={newBuildName}
                onChange={e=>setNewBuildName(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&newBuildName.trim()&&newBuild(newBuildName)}
                style={{flex:1,minWidth:200,fontSize:16,padding:'10px 14px',minHeight:44}} autoFocus/>
              <button onClick={()=>newBuildName.trim()&&newBuild(newBuildName)} disabled={!newBuildName.trim()}
                style={{background:newBuildName.trim()?"#16a34a":"#1a2330",color:newBuildName.trim()?"#fff":"#475569",
                  padding:"0 28px",fontWeight:700,fontSize:15,borderRadius:6,minHeight:44}}>
                Create →
              </button>
            </div>
          </div>
          <div style={{background:"#0d1117",borderRadius:14,padding:28,border:"1px solid #1e293b"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#b48c3c",letterSpacing:3,textTransform:"uppercase",marginBottom:14}}>
              💾 Saved Builds <span style={{color:"#334155",fontWeight:400}}>({saves.length})</span>
            </div>
            {saves.length===0&&<div style={{color:"#334155",fontSize:13,padding:"24px 0",textAlign:"center",borderTop:"1px solid #1e293b"}}>No builds yet — create your first build above</div>}
            {saves.map((save,i)=>{
              const arr=save.countries?JSON.parse(save.countries):[];
              const docs=[...new Set(arr.map(c=>c.doctrine))];
              return(
                <div key={save.key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,
                  padding:"18px 20px",marginBottom:i<saves.length-1?8:0,borderRadius:8,cursor:"pointer",
                  background:"#111827",border:"1px solid #1e293b",borderLeft:"3px solid #b48c3c"}}
                  onMouseEnter={e=>{e.currentTarget.style.background="#151e2d";}}
                  onMouseLeave={e=>{e.currentTarget.style.background="#111827";}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:18,fontWeight:700,color:"#e2e8f0",marginBottom:4}}>{save.name}</div>
                    <div style={{fontSize:11,color:"#475569",display:"flex",gap:10,flexWrap:"wrap"}}>
                      <span>🕒 {save.updatedAt?new Date(save.updatedAt).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}</span>
                      <span>🌍 {arr.length} {arr.length===1?'country':'countries'}</span>
                      {docs.length>0&&<span style={{color:"#64748b"}}>{docs.join(', ')}</span>}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    <button onClick={()=>loadBuild(save)} style={{background:"#1e3a5f",color:"#60a5fa",padding:"9px 22px",fontSize:13,fontWeight:700,borderRadius:6,border:"1px solid #1e40af"}}>Open</button>
                    <button onClick={e=>deleteBuild(save,e)} style={{background:"#1a0a0a",color:"#f87171",padding:"9px 14px",fontSize:14,borderRadius:6,border:"1px solid #7f1d1d"}}>🗑</button>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{textAlign:"center",marginTop:24,fontSize:10,color:"#1e293b",letterSpacing:2,textTransform:"uppercase"}}>Amicitia Ferox · Since 2024</div>
        </div>
      </div>

  return(
    <div style={{minHeight:"100vh",background:"#0d1117",color:"#e2e8f0",fontFamily:"'Rajdhani',sans-serif"}}>
      <div className="app-header">
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={()=>setScreen('home')}
            style={{background:"#1e293b",color:"#94a3b8",padding:"6px 12px",fontSize:12,fontWeight:700,borderRadius:6,marginRight:4}}>

        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>

            {syncStatus==='synced'?"Auto-saved":syncStatus==='saving'?"Saving...":syncStatus==='error'?"Sync error":"Connecting..."}
          </div>
          {presentUsers.length>0&&(
            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>

                const tabIcons={"cities":"🏙","production":"⚔️","upgrades":"⬆️","research":"🔬","buildings":"🏗"};
                const tabIcon=u.tab?tabIcons[u.tab]||"📋":"";
                return(
                  <div key={u.sessionId} style={{background:"#0d1f35",border:"1px solid #1e3a5f",borderRadius:6,padding:"3px 8px",fontSize:11,color:"#93c5fd",display:"flex",flexDirection:"column",gap:1,maxWidth:200}}>

      <div className="app-layout">
        <div className="app-main" style={{display:mobilePanel==='calc'?'block':'none'}} id="panel-calc">

          {countries.map(c=><CountryCard key={c.id} country={c} morale={morale} onChange={updated=>updateCountry(c.id,updated)} onRemove={()=>removeCountry(c.id)}/>)}
        </div>

        <div className="app-sidebar" id="panel-overview" style={{display:mobilePanel==='overview'?'block':'none'}}>
          <style>{`@media(min-width:769px){#panel-overview{display:block!important}}`}</style>
          {/* Header */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,paddingBottom:10,borderBottom:"1px solid #1e293b"}}>
            <div style={{fontSize:13,fontWeight:700,letterSpacing:2,color:"#64748b",textTransform:"uppercase"}}>📊 Overview</div>
            <div style={{display:"flex",gap:4}}>
              {[0,1,2,3].map(d=><button key={d} onClick={()=>setSidebarDay(d)}
                style={{padding:"3px 8px",fontSize:11,fontWeight:700,borderRadius:4,cursor:"pointer",
                  background:sidebarDay===d?dayColors[d]:"#1e293b",
                  color:sidebarDay===d?"#fff":dayColors[d],
                  border:`1px solid ${dayColors[d]}`}}>
                {d===0?"All":`D${d}`}
              </button>)}
            </div>
          </div>

          {/* Per country */}
          {countries.map(c=>{
            const filtItems=getFilteredItems(c);
            const cost=sumCosts(filtItems.map(i=>i.cost));
            const warbonds=(c.cities||[]).reduce((s,ci)=>s+(ci.warbond||0),0);
            const budget=c.name?(sidebarDay===0?calcDynamicBudget(c.name,c.capitals||[],warbonds):calcCumulativeBudget(c.name,c.capitals||[],warbonds,sidebarDay)):null;
            const cityIncTotal=calcCityIncome(c.cities||[], c.capitals||[], warbonds);
            const cityInc=sidebarDay===0?cityIncTotal:Object.fromEntries(Object.entries(cityIncTotal).map(([k,v])=>[k,Math.round(v/3*sidebarDay)]));
            const docColor=DOCTRINE_COLORS[c.doctrine];
            const hasAny=RES_KEYS.some(k=>(cost[k]||0)>0||(budget&&budget[k]||0)>0||(cityInc[k]||0)>0);
            return<div key={c.id} style={{background:"#0d1117",borderRadius:8,padding:12,marginBottom:10,borderLeft:`3px solid ${docColor}`}}>
              {/* Country name + doctrine */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0"}}>{c.name||"— no country —"}</div>
                <div style={{fontSize:9,color:docColor,textTransform:"uppercase",letterSpacing:1,fontWeight:700,background:"#1e293b",padding:"2px 6px",borderRadius:3}}>{c.doctrine}</div>
              </div>
              {!hasAny&&<div style={{fontSize:11,color:"#334155",fontStyle:"italic"}}>No items added</div>}
              {/* Resource rows */}
              {hasAny&&<div style={{display:"grid",gridTemplateColumns:"auto 1fr 1fr 1fr",alignItems:"center",gap:"3px 8px"}}>
                {RES_KEYS.map(k=>{
                  const inc=((budget&&budget[k])||0)+(cityInc[k]||0);
                  const c2=cost[k]||0;
                  const netto=inc-c2;
                  if(inc===0&&c2===0)return null;
                  return([
                    <ResImg key={k+"i"} k={k} size={14}/>,
                    <span key={k+"inc"} style={{color:"#22c55e",fontFamily:"monospace",fontSize:15,textAlign:"right"}}>+{fmtC(inc)}</span>,
                    <span key={k+"cost"} style={{color:"#ef4444",fontFamily:"monospace",fontSize:15,textAlign:"right"}}>-{fmtC(c2)}</span>,
                    <span key={k+"net"} style={{color:netto>=0?"#facc15":"#ef4444",fontFamily:"monospace",fontWeight:700,fontSize:15,textAlign:"right"}}>{netto>=0?"+":""}{fmtC(netto)}</span>
                  ]);
                })}
              </div>}
            </div>;
          })}

          {/* Grand Total */}
          {countries.length>1&&<div style={{background:"#0f172a",borderRadius:8,padding:12,marginTop:4,border:"1px solid #334155"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",marginBottom:10,textTransform:"uppercase",letterSpacing:2}}>⚖️ Grand Total</div>
            <div style={{display:"grid",gridTemplateColumns:"auto 1fr 1fr 1fr",alignItems:"center",gap:"4px 8px"}}>
              {RES_KEYS.filter(k=>k!=="manpower").map(k=>{
                const inc=grandIncome[k]||0;
                const cost=grandTotal[k]||0;
                const netto=inc-cost;
                if(inc===0&&cost===0)return null;
                return([
                  <ResImg key={k+"i"} k={k} size={16}/>,
                  <span key={k+"inc"} style={{color:"#22c55e",fontFamily:"monospace",fontSize:15,textAlign:"right"}}>+{fmtC(inc)}</span>,
                  <span key={k+"cost"} style={{color:"#ef4444",fontFamily:"monospace",fontSize:15,textAlign:"right"}}>-{fmtC(cost)}</span>,
                  <span key={k+"net"} style={{color:netto>=0?"#facc15":"#ef4444",fontFamily:"monospace",fontWeight:700,fontSize:17,textAlign:"right"}}>{netto>=0?"+":""}{fmtC(netto)}</span>
                ]);
              })}
            </div>
          </div>}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
